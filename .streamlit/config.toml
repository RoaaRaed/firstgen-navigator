[server]
# Do not watch installed packages for changes: the watcher walks torch/transformers modules
# and prints noisy errors (and wastes time) on every start.
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
# The Admin page (app/pages/9_Admin.py) is not listed in a menu; staff open it at /Admin.
showSidebarNavigation = false

# Linen and olive. Keep these in step with app/theme.py (tests/test_theme.py checks it).
[theme]
base = "light"
primaryColor = "#5B6B3A"
backgroundColor = "#F4F0E6"
secondaryBackgroundColor = "#EDE7D8"
textColor = "#26261F"
linkColor = "#5B6B3A"
borderColor = "#DDD7C3"
codeTextColor = "#5B6B3A"
codeBackgroundColor = "#EDE7D8"
baseRadius = "medium"
